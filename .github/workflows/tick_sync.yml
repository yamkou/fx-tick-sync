name: Weekly Tick Data Sync

on:
  schedule:
    - cron: '0 2 * * 6' # 毎週土曜日 UTC 02:00 (日本時間 11:00)
  workflow_dispatch:

concurrency:
  group: sync-tick-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install dukascopy-python duckdb google-api-python-client google-auth python-dateutil

      - name: Run Self-Healing Sync
        env:
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python sync_and_upload.py
