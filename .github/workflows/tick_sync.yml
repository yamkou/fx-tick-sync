name: Weekly Tick Data Sync

on:
  schedule:
    - cron: '0 22 * * 5' # 毎週土曜 日本時間 07:00 (UTC 金曜 22:00)
  workflow_dispatch:      # 管理画面から手動ボタン実行も可能にする設定

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係のインストール
        run: pip install -r requirements.txt

      - name: ティック同期とGoogleドライブアップロード
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
        run: python sync_and_upload.py
